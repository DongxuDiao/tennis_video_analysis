[project]
name = "tennis-agent-backend"
version = "0.1.0"
description = "Local tennis wall-practice video analysis backend (no training, offline inference)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9",
  "ultralytics>=8.3.0,<9",
  "mediapipe>=0.10.14,<0.11",
  "opencv-python>=4.10,<5",
  "av>=13,<14",  # 14.4.0 is sdist-only; 13.1.0 ships macOS arm64 wheels
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "imageio>=2.35,<3",
  "imageio-ffmpeg>=0.6,<1",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",  # 生产依赖：GLM provider 适配器 HTTP 客户端
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "requests>=2.32,<3",
]

[tool.uv]
# Keep the environment reproducible; lockfile is committed.
[tool.pytest.ini_options]
testpaths = ["tests"]
